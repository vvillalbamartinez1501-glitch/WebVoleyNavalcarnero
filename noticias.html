<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualidad y Noticias</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background-color: #fcfcfc; }
        h1 { text-align: center; margin-bottom: 40px; }
        
        /* Rejilla de noticias */
        .grid-noticias { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        /* Tarjeta individual */
        .card { background: white; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-content { padding: 15px; }
        .card-date { font-size: 0.8em; color: #888; }
        .card h3 { margin: 10px 0; font-size: 1.2em; }
        .card a { text-decoration: none; color: inherit; display: block; }
        
        /* Botón inicio */
        .nav { margin-bottom: 20px; }
        .nav a { text-decoration: none; color: #333; font-weight: bold; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/index.html">← Volver al Inicio</a>
    </div>

    <h1>Últimas Noticias</h1>
    
    <div id="contenedor-noticias" class="grid-noticias">
        <p>Cargando noticias...</p>
    </div>

    <script>
        // 1. Buscamos el archivo JSON
        fetch('/noticias.json')
            .then(response => response.json())
            .then(data => {
                const contenedor = document.getElementById('contenedor-noticias');
                
                // Si no hay noticias
                if (data.length === 0) {
                    contenedor.innerHTML = '<p style="text-align:center; width:100%">No hay noticias publicadas aún.</p>';
                    return;
                }

                contenedor.innerHTML = ''; // Limpiamos el mensaje de carga
                
                // Ordenamos para ver la más reciente primero
                data.reverse();

                // 2. Por cada noticia en el JSON, creamos una tarjeta
                data.forEach(noticia => {
                    // Si es video, usamos una imagen genérica o intentamos sacar un thumbnail (por ahora usaremos un placeholder si no hay foto)
                    // Nota: El script de python guardará la ruta de la imagen en el JSON.
                    let imagenHTML = '';
                    if (noticia.imagen) {
                        imagenHTML = `<img src="${noticia.imagen}" alt="Imagen noticia">`;
                    } else {
                        imagenHTML = `<div style="height:200px; background:#eee; display:flex; align-items:center; justify-content:center;">VIDEO</div>`;
                    }

                    const html = `
                        <div class="card">
                            <a href="/noticias/${noticia.archivo}">
                                ${imagenHTML}
                                <div class="card-content">
                                    <p class="card-date">${noticia.fecha}</p>
                                    <h3>${noticia.titulo}</h3>
                                </div>
                            </a>
                        </div>
                    `;
                    contenedor.innerHTML += html;
                });
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('contenedor-noticias').innerHTML = '<p>Error cargando las noticias.</p>';
            });
    </script>
</body>
</html>
